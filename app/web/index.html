<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HapticScroll</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f4f1;font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif}.app{width:min(940px,calc(100% - 36px));margin:42px auto}.top,.foot,.head,.controltop{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:25px}.dot{display:inline-block;width:10px;height:10px;margin-right:9px;border-radius:50%;background:#a4ffb7;box-shadow:0 0 18px #7de49d}.status{color:#a4ffb7;font-size:12px;font-weight:800}.hero{text-align:center;margin:42px 0 28px}.hero h1{font-size:52px;line-height:1.02;letter-spacing:-2.5px;margin:0}.hero p,.hint,.sub{color:#939ca9}.mode{text-align:center;margin-bottom:22px}.mode button,.voice,.lab,.test{cursor:pointer;border-radius:10px;font-weight:750}.mode button{background:#151820;color:#939aa7;border:1px solid #252a34;padding:11px 23px}.mode button.on{background:#edf5ed;color:#101410}.panel{background:#11141b;border:1px solid #262c37;border-radius:20px;overflow:hidden;box-shadow:0 30px 90px #0008}.head{padding:22px 26px;border-bottom:1px solid #282e39}.eyebrow{color:#929aa8;font-size:11px;letter-spacing:1px;font-weight:800}.head h2{font-size:23px;margin:5px 0 0}.content{padding:25px}.label{font-size:11px;color:#939ba8;letter-spacing:1.1px;font-weight:800;margin-bottom:12px}.voices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:28px}.voice{background:#191e28;border:1px solid #29303d;color:#eef0f3;padding:13px;text-align:left}.voice:hover{border-color:#69768c}.voice.active{background:#193124;border-color:#8de7a7;color:#adffc2}.voice small{display:block;color:#949daa;margin-top:4px}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:25px}.control{border-top:1px solid #28303b;padding-top:17px}.value{color:#a4ffb7;font-weight:800}.hint{font-size:12px;margin:5px 0 11px}input[type=range]{width:100%;accent-color:#a4ffb7}.switch{appearance:none;width:44px;height:26px;border-radius:20px;background:#343b47;position:relative;cursor:pointer}.switch:checked{background:#86edab}.switch:before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}.switch:checked:before{left:21px}.foot{margin-top:27px;border-top:1px solid #28303b;padding-top:18px;color:#a2aab7}.lab,.test{border:0;padding:10px 14px}.lab{background:#293142;color:#fff;margin-right:8px}.test{background:#eff7ef;color:#101410}.modal{position:fixed;inset:0;background:#05070bd9;display:grid;place-items:center;padding:20px}.box{width:min(710px,100%);background:#111722;border:1px solid #354055;border-radius:20px;padding:25px}.close{float:right;background:0;border:0;color:white;font-size:24px;cursor:pointer}.editor,.scrollbox{width:100%;background:#090d14;border:1px solid #2c3647;border-radius:12px;color:#eef5f0;padding:16px;font:16px ui-monospace,Menlo,monospace;outline:none}.editor{height:220px;resize:none}.scrollbox{height:280px;overflow:auto;padding:0 18px}.scrollbox p{height:100px;border-bottom:1px solid #202a3a;display:flex;align-items:center;color:#91a0b4}.live{color:#a4ffb7;font-size:12px;font-weight:800}@media(max-width:650px){.hero h1{font-size:38px}.voices{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.app{margin-top:24px}}
</style></head><body><main class="app"><div class="top"><div class="brand"><i class="dot"></i>HapticScroll</div><label class="status">ENGINE <input id="master" class="switch" type="checkbox"></label></div><div class="hero"><h1>Make every input<br>feel better.</h1><p>Choose a voice for each input. Tune the feeling. Everything saves instantly.</p></div><div class="mode"><button class="on" data-kind="scroll">Scroll</button><button data-kind="type">Keyboard</button></div><section class="panel"><div class="head"><div><div class="eyebrow" id="eye">SCROLL FEEDBACK</div><h2 id="title">Choose your scroll voice</h2></div><input id="enabled" class="switch" type="checkbox"></div><div class="content"><div class="label">SOUND VOICE — CLICK TO PREVIEW</div><div id="voices" class="voices"></div><div class="controls"><div class="control"><div class="controltop"><b>Volume</b><span id="volV" class="value"></span></div><div class="hint">How present each detent feels</div><input id="volume" type="range" min="0" max="100"></div><div class="control"><div class="controltop"><b>Haptic intensity</b><span id="intV" class="value"></span></div><div class="hint">0 disables · high is firmer</div><input id="intensity" type="range" min="0" max="100"></div></div><div class="foot"><label>Trackpad haptics <input id="haptic" class="switch" type="checkbox"></label><div><button id="lab" class="lab">Open live test</button><button id="preview" class="lab">Preview selected</button><button id="apply" class="test">Apply changes</button></div></div></div></section></main><script>
const voices=[['Nok','Rounded'],['Crisp','Mechanical'],['Velvet','Soft tap'],['Deep','Low detent'],['Vinyl','Textured'],['Pop','Bright snap'],['Wood','Warm tick']];
let applied={},draft={},kind='scroll',dirty=false;const q=id=>document.getElementById(id);
const api=(p,d)=>fetch(p,{method:d?'POST':'GET',headers:{'Content-Type':'application/json'},body:d?JSON.stringify(d):null}).then(x=>x.json());
function K(){return kind==='scroll'?{on:'scroll_sound_enabled',v:'scroll_sound_volume',h:'scroll_haptic_enabled',i:'scroll_haptic_intensity',p:'scroll_sound_pack'}:{on:'type_sound_enabled',v:'type_sound_volume',h:'type_haptic_enabled',i:'type_haptic_intensity',p:'type_sound_pack'}}
function render(){let k=K();q('master').checked=!!draft.master_enabled;q('enabled').checked=!!draft[k.on];q('haptic').checked=!!draft[k.h];q('volume').value=draft[k.v];q('intensity').value=draft[k.i];q('volV').textContent=draft[k.v]+'%';q('intV').textContent=draft[k.i]+'%';q('eye').textContent=kind==='scroll'?'SCROLL FEEDBACK':'KEYBOARD FEEDBACK';q('title').textContent=kind==='scroll'?'Choose your scroll voice':'Choose your keyboard voice';q('apply').textContent=dirty?'Apply changes':'Applied ✓';q('voices').innerHTML=voices.map(x=>`<button class="voice ${draft[k.p]===x[0]?'active':''}" data-v="${x[0]}"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('');document.querySelectorAll('.voice').forEach(b=>b.onclick=()=>{draft[k.p]=b.dataset.v;dirty=true;render();api('/api/preview',{kind,voice:b.dataset.v,config:draft})})}
function change(o){Object.assign(draft,o);dirty=true;render()}
async function apply(){applied=await api('/api/settings',draft);draft={...applied};dirty=false;render()}
q('master').onchange=e=>change({master_enabled:+e.target.checked});q('enabled').onchange=e=>change({[K().on]:+e.target.checked});q('haptic').onchange=e=>change({[K().h]:+e.target.checked});[['volume','v','volV'],['intensity','i','intV']].forEach(x=>{q(x[0]).oninput=e=>{draft[K()[x[1]]]=+e.target.value;dirty=true;q(x[2]).textContent=e.target.value+'%';q('apply').textContent='Apply changes'};q(x[0]).onchange=()=>render()});q('apply').onclick=apply;q('preview').onclick=()=>api('/api/preview',{kind,voice:draft[K().p],config:draft});
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('.mode button').forEach(x=>x.classList.toggle('on',x===b));render()});
q('lab').onclick=openLab;function openLab(){api('/api/lab',{kind,active:true});let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><button class="close">×</button><span class="live">LIVE ${kind==='scroll'?'SCROLL':'KEYBOARD'} LAB — APPLIED SETTINGS</span><h2>${kind==='scroll'?'Scroll through the test surface':'Type in the test editor'}</h2><p>This test calls the same engine and saved configuration as system-wide feedback.</p>${kind==='scroll'?'<div class="scrollbox">'+Array.from({length:9},(_,i)=>'<p>Scroll detent '+(i+1)+' — applied voice only.</p>').join('')+'</div>':'<textarea class="editor" autofocus placeholder="Start typing here…"></textarea>'}</div>`;document.body.append(m);let last=0,fire=()=>{let t=Date.now();if(t-last>28){last=t;api('/api/event',{kind,config:draft})}};let target=m.querySelector(kind==='scroll'?'.scrollbox':'.editor');if(kind==='scroll'){target.addEventListener('scroll',fire)}else{let repeater=null;target.addEventListener('keydown',e=>{if(e.repeat)return;fire();clearTimeout(repeater);repeater=setTimeout(function loop(){fire();repeater=setTimeout(loop,28)},220)});let release=()=>{clearTimeout(repeater);repeater=null};target.addEventListener('keyup',release);target.addEventListener('blur',release)}let close=()=>{api('/api/lab',{kind,active:false});m.remove()};m.querySelector('.close').onclick=close;m.onclick=e=>{if(e.target===m)close()}}
api('/api/settings').then(x=>{applied=x;draft={...x};render()});setInterval(()=>{if(!dirty)api('/api/settings').then(x=>{applied=x;draft={...x};render()})},1500);
</script></body></html>
